name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  MLFLOW_TRACKING_URI: http://localhost:5000
  MODEL_NAME: distilgpt2
  MAX_LENGTH: 100
  TEMPERATURE: 0.8

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-distilgpt2
        restore-keys: |
          ${{ runner.os }}-huggingface-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black httpx2
    
    - name: Start MLflow server with SQLite
      run: |
        # Use SQLite backend instead of filesystem
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri sqlite:///mlflow.db \
          --default-artifact-root ./artifacts \
          --serve-artifacts &
        sleep 5
        echo "MLflow server started"
    
    - name: Verify MLflow is running
      run: |
        for i in {1..30}; do
          if curl -s http://localhost:5000/health > /dev/null; then
            echo "✅ MLflow is running!"
            exit 0
          fi
          echo "Waiting for MLflow... ($i/30)"
          sleep 2
        done
        echo "❌ MLflow failed to start"
        cat mlflow.log 2>/dev/null || echo "No log file"
        exit 1
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  train:
    name: 🤖 Train & Register
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-distilgpt2
        restore-keys: |
          ${{ runner.os }}-huggingface-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Start MLflow server with SQLite
      run: |
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri sqlite:///mlflow.db \
          --default-artifact-root ./artifacts \
          --serve-artifacts &
        sleep 10
        echo "MLflow server started"
        ls -la mlflow.db 2>/dev/null || echo "Database file not yet created"
    
    - name: Verify MLflow is running
      run: |
        for i in {1..30}; do
          if curl -s http://localhost:5000/health > /dev/null; then
            echo "✅ MLflow is running!"
            exit 0
          fi
          echo "Waiting for MLflow... ($i/30)"
          sleep 2
        done
        echo "❌ MLflow failed to start"
        exit 1
    
    - name: Run training pipeline
      run: |
        python -m app.train
    
    - name: Verify model in registry
      run: |
        python -c "
        from app.registry import ModelRegistry
        registry = ModelRegistry()
        versions = registry.list_versions()
        print(f'✅ Model versions: {versions}')
        assert len(versions) > 0, 'No models found in registry'
        "
    
    - name: Upload MLflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-artifacts
        path: |
          mlflow.db
          artifacts/
          logs/

  docker:
    name: 🐳 Build & Push Docker
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/llm-mlops:latest
          ghcr.io/${{ github.repository }}/llm-mlops:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image
      run: |
        docker run -d -p 8000:8000 --name test-container ghcr.io/${{ github.repository }}/llm-mlops:latest
        sleep 15
        curl -f http://localhost:8000/ || (docker logs test-container && exit 1)
        docker stop test-container
        docker rm test-container
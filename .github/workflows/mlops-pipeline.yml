name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  MLFLOW_TRACKING_URI: sqlite:///mlflow.db
  MODEL_NAME: distilgpt2
  MAX_LENGTH: 100
  TEMPERATURE: 0.8

jobs:
  # JOB 1: Test
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-distilgpt2
        restore-keys: |
          ${{ runner.os }}-huggingface-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black httpx2
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # JOB 2: Train & Register
  train:
    name: 🤖 Train & Register
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-distilgpt2
        restore-keys: |
          ${{ runner.os }}-huggingface-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
    
    - name: Start MLflow with SQLite
      run: |
        mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db &
        sleep 10
    
    - name: Verify MLflow is running
      run: |
        for i in {1..30}; do
          if curl -s http://localhost:5000/health > /dev/null; then
            echo "✅ MLflow is running!"
            exit 0
          fi
          echo "Waiting for MLflow... ($i/30)"
          sleep 2
        done
        echo "❌ MLflow failed to start"
        exit 1
    
    - name: Run training pipeline
      run: |
        python -m app.train
    
    - name: Verify model in registry
      run: |
        python -c "
        from app.registry import ModelRegistry
        registry = ModelRegistry()
        versions = registry.list_versions()
        print(f'✅ Model versions found: {len(versions)}')
        for v in versions:
            print(f'  - Version {v[\"version\"]}: Status {v[\"status\"]}')
        "
    
    - name: Upload MLflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-artifacts
        path: |
          mlflow.db
          artifacts/
          logs/

  # JOB 3: Build Docker
  docker:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/llm-mlops:latest
          ${{ secrets.DOCKER_USERNAME }}/llm-mlops:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker image with SQLite
      run: |
        echo "🚀 Testing Docker image with SQLite backend..."
        
        # Run container with SQLite backend (NO MLflow server needed!)
        docker run -d -p 8000:8000 --name test-container \
          -e MLFLOW_TRACKING_URI=sqlite:///mlflow.db \
          ${{ secrets.DOCKER_USERNAME }}/llm-mlops:latest
        
        # Wait for container to start
        echo "⏳ Waiting for container to start..."
        sleep 20
        
        # Check if container is running
        if [ "$(docker ps -q -f name=test-container)" ]; then
          echo "✅ Container is running"
        else
          echo "❌ Container failed to start"
          docker logs test-container
          exit 1
        fi
        
        # Test health endpoint
        echo "🔍 Testing health endpoint..."
        curl -f http://localhost:8000/ || (docker logs test-container && exit 1)
        
        # Test generation endpoint
        echo "🔍 Testing generation endpoint..."
        curl -f -X POST http://localhost:8000/generate \
          -H "Content-Type: application/json" \
          -d '{"prompt": "Explain MLOps"}' || (docker logs test-container && exit 1)
        
        echo "✅ All tests passed!"
        
        # Clean up
        docker stop test-container
        docker rm test-container

  # JOB 4: Deploy to Render
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to Render
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      run: |
        if [ -z "$RENDER_API_KEY" ]; then
          echo "⚠️ RENDER_API_KEY not set. Skipping deployment."
          exit 0
        fi
        echo "🚀 Deploying to Render..."
        curl -X POST \
          -H "Authorization: Bearer $RENDER_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"serviceId": "'"$RENDER_SERVICE_ID"'"}' \
          https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys

  # JOB 5: Notification
  notify:
    name: 📧 Notification
    runs-on: ubuntu-latest
    needs: [test, train, docker, deploy]
    if: always()
    
    steps:
    - name: Check workflow status
      run: |
        echo "========================================"
        echo "  Pipeline Status Summary"
        echo "========================================"
        echo "✅ Test Status: ${{ needs.test.result }}"
        echo "✅ Train Status: ${{ needs.train.result }}"
        echo "✅ Docker Status: ${{ needs.docker.result }}"
        echo "✅ Deploy Status: ${{ needs.deploy.result }}"
        echo "========================================"